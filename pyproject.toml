[project]
name = "recipe-mcp"
version = "0.1.0"
description = "Shared household recipe assistant exposed through MCP"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "recipe-mcp contributors" }]
dependencies = [
    "mcp>=1.10",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.50",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Authenticated NYT fallback only. Kept out of the default install so the offline
# test suite, the MCP server and the Telegram host never need a browser.
browser = ["playwright>=1.47"]

[project.scripts]
recipe-mcp = "recipe_mcp.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:recipe_mcp.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["recipe_mcp"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "playwright", "playwright.*"]
ignore_missing_imports = true
