name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Read-only token: no step here needs to write to the repository.
# Actions are pinned to full commit SHAs (tags can be moved); Dependabot proposes updates.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI never uses a developer .env; everything below is safe test configuration.
      APP_ENV: test
      DATABASE_URL: "sqlite:///:memory:"
      MODEL_PROVIDER: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q
      - name: Offline evals
        run: uv run recipe-mcp --env-file /nonexistent eval
      - name: Doctor
        run: uv run recipe-mcp --env-file /nonexistent doctor

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks lists a pull request's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
