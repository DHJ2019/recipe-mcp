name: dependency-audit

# Checks every locked dependency (uv.lock, all extras) against known vulnerabilities.
# Runs weekly, on demand, and on pull requests that change dependencies.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml

permissions:
  contents: read

jobs:
  pip-audit:
    # The public mirror has the same uv.lock, so one audit covers both repositories.
    # It runs in the private repository, where the deployed code comes from.
    if: github.repository == 'DHJ2019/recipe-mcp-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Export locked requirements
        run: uv export --frozen --all-extras --no-emit-project --format requirements-txt -o requirements.txt
      - name: Audit
        run: uvx pip-audit --strict --disable-pip -r requirements.txt
